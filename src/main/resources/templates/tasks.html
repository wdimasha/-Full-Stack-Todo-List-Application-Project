<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #1a0000 50%, #2d0000 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            animation: fadeIn 1.5s ease-in;
        }

        h1 {
            color: #ff0000;
            text-align: center;
            padding: 30px 0;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
            animation: slideDown 0.8s ease-out, glowPulse 2s ease-in-out infinite;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.3);
            border: 1px solid rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(255, 0, 0, 0.5);
        }

        input[type="text"] {
            background: #1a1a1a;
            border: 2px solid #ff0000;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 25px;
            width: 100%;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            background: #2a2a2a;
            transform: scale(1.02);
        }

        input[type="text"]::placeholder {
            color: #888;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        button {
            background: linear-gradient(135deg, #ff0000, #8b0000);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        button:hover {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            animation: none;
        }

        button:active {
            transform: scale(0.98);
        }

        .tasks-container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out;
        }

        .task-item {
            background: linear-gradient(90deg, rgba(255, 0, 0, 0.1), rgba(0, 0, 0, 0.6));
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #ff0000;
            transition: all 0.3s ease;
            animation: slideInLeft 0.5s ease-out;
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .task-item:hover {
            transform: translateX(10px);
            background: linear-gradient(90deg, rgba(255, 0, 0, 0.2), rgba(0, 0, 0, 0.7));
            border-left-width: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .task-item span {
            flex: 1;
            word-break: break-word;
            transition: all 0.3s ease;
        }

        .task-actions {
            display: flex;
            gap: 12px;
        }

        .task-actions a {
            text-decoration: none;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: linear-gradient(135deg, #ff4444, #aa0000);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            animation: fadeInUp 0.5s ease-out;
        }

        .task-actions a:first-child {
            background: linear-gradient(135deg, #00c853, #009624);
            border-color: rgba(0, 255, 100, 0.3);
            box-shadow: 0 2px 8px rgba(0, 200, 80, 0.3);
        }

        .task-actions a:first-child:hover {
            background: linear-gradient(135deg, #00e661, #00b82e);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 100, 0.5);
        }

        .task-actions a:last-child {
            background: linear-gradient(135deg, #ff1744, #b71c1c);
            border-color: rgba(255, 30, 70, 0.4);
            box-shadow: 0 2px 8px rgba(255, 30, 70, 0.3);
        }

        .task-actions a:last-child:hover {
            background: linear-gradient(135deg, #ff3355, #d50000);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 30, 70, 0.6);
        }

        .task-actions a:active {
            transform: translateY(1px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0);
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff0000;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cc0000;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8rem;
                padding: 20px 0;
            }

            .task-item {
                font-size: 14px;
                padding: 12px 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            .task-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .task-actions a {
                padding: 5px 14px;
                font-size: 13px;
            }
        }

        .tasks-container:empty::before {
            content: "✨ No tasks yet. Add your first task above! ✨";
            display: block;
            text-align: center;
            color: #ff6666;
            padding: 40px;
            font-style: italic;
            animation: fadeInOut 3s ease-in-out infinite;
        }
                .task-completed {
            background: linear-gradient(90deg, rgba(0, 255, 0, 0.1), rgba(0, 30, 0, 0.6));
            border-left-color: #00ff00;
            opacity: 0.85;
        }

        .task-completed:hover {
            background: linear-gradient(90deg, rgba(0, 255, 0, 0.15), rgba(0, 50, 0, 0.7));
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .completed-text {
            text-decoration: line-through;
            color: #88ff88;
            font-style: italic;
        }

        .task-completed .task-actions a:first-child {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            opacity: 0.8;
        }

        .task-completed .task-actions a:first-child:hover {
            background: linear-gradient(135deg, #388e3c, #2e7d32);
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 TO DO APPLICATION 🎯</h1>

    <div class="form-container">
        <form action="/" method="post">
            <div>
                <input type="text" name="title" placeholder="Add a new task..." required>
            </div>
            <div>
                <button type="submit">✨ Add Task ✨</button>
            </div>
        </form>
    </div>

    <div class="tasks-container">
        <th:block th:each="task : ${tasks}">
            <div class="task-item" th:classappend="${task.completed} ? 'task-completed' : ''">
                <span th:text="${task.title}" th:classappend="${task.completed} ? 'completed-text' : ''">Task Title</span>
                <div class="task-actions">
                    <a th:href="@{/{id}/toggle(id=${task.id})}">complete</a>
                    <a th:href="@{/{id}/delete(id=${task.id})}">delete</a>
                </div>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
